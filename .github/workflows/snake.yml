name: Generate contribution snake

on:
  schedule:
    # runs once a day, just after midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate the snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JohntheAIdeveloper
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232F6FFF&color_dots=%230F1420,%23142339,%231E3A5F,%232F6FFF,%232BD4E0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the generated SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
