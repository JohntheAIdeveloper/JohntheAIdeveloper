<svg width="1200" height="8" viewBox="0 0 1200 8" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0E17" stop-opacity="0"/>
      <stop offset="15%" stop-color="#2F6FFF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#2BD4E0" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#2F6FFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="3" width="1200" height="2" fill="url(#lineGrad)"/>

  <rect x="-150" y="2.5" width="150" height="3" fill="url(#sweepGrad)" opacity="0.6">
    <animate attributeName="x" from="-150" to="1200" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
