<svg width="960" height="210" viewBox="0 0 960 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End-to-End IoT &amp; Cloud Data Pipeline Architecture">
  <defs>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2BD4E0"/>
      <stop offset="40%" stop-color="#2F6FFF"/>
      <stop offset="70%" stop-color="#2BD4E0"/>
      <stop offset="100%" stop-color="#2F6FFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121A2A"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="960" height="210" rx="14" fill="#0A0E17" stroke="#162234" stroke-width="1.5"/>

  <!-- Background Signal Backbone Line -->
  <line x1="125" y1="100" x2="835" y2="100" stroke="url(#pipeGrad)" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.45"/>

  <!-- Traveling Animated Data Packets -->
  <circle r="4.5" fill="#2BD4E0" filter="url(#glowCyan)">
    <animateMotion path="M 125 100 L 835 100" dur="4.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="4" fill="#2F6FFF" filter="url(#glowCyan)">
    <animateMotion path="M 125 100 L 835 100" dur="4.2s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
  <circle r="4.5" fill="#2BD4E0" filter="url(#glowCyan)">
    <animateMotion path="M 125 100 L 835 100" dur="4.2s" repeatCount="indefinite" begin="2.8s"/>
  </circle>

  <!-- ==================== NODE 1: IoT SENSOR DEVICE ==================== -->
  <g transform="translate(35, 25)">
    <rect width="185" height="160" rx="10" fill="url(#cardGrad)" stroke="#1F314D" stroke-width="1.5"/>
    <!-- Status Tag -->
    <rect x="14" y="14" width="76" height="18" rx="9" fill="#132338" stroke="#22395A" stroke-width="1"/>
    <circle cx="23" cy="23" r="3.5" fill="#2BD4E0" filter="url(#glowCyan)"/>
    <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#2BD4E0" letter-spacing="0.5">HARDWARE</text>
    <!-- Icon: Microcontroller Chip -->
    <g transform="translate(136, 12)" stroke="#2BD4E0" stroke-width="1.4" fill="none">
      <rect x="4" y="4" width="20" height="20" rx="3" fill="#0C1420"/>
      <circle cx="14" cy="14" r="3" fill="#2BD4E0"/>
      <path d="M4 9 H0 M4 14 H0 M4 19 H0 M24 9 H28 M24 14 H28 M24 19 H28 M9 4 V0 M14 4 V0 M19 4 V0 M9 24 V28 M14 24 V28 M19 24 V28"/>
    </g>
    <!-- Node Content -->
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">IoT Sensor Device</text>
    <text x="14" y="88" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" fill="#2BD4E0">MQTT / Telemetry</text>
    <line x1="14" y1="102" x2="171" y2="102" stroke="#16253B" stroke-width="1"/>
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#8FA3BE">Real-time sensor feed</text>
    <text x="14" y="139" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#586E88">TLS-authenticated stream</text>
  </g>

  <!-- Protocol Connector 1 -> 2 -->
  <g transform="translate(225, 87)">
    <rect width="45" height="26" rx="6" fill="#0E1624" stroke="#243854" stroke-width="1.2"/>
    <text x="22.5" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#2BD4E0">MQTT</text>
  </g>

  <!-- ==================== NODE 2: AWS IoT CLOUD ==================== -->
  <g transform="translate(275, 25)">
    <rect width="185" height="160" rx="10" fill="url(#cardGrad)" stroke="#1F314D" stroke-width="1.5"/>
    <!-- Status Tag -->
    <rect x="14" y="14" width="76" height="18" rx="9" fill="#132338" stroke="#22395A" stroke-width="1"/>
    <circle cx="23" cy="23" r="3.5" fill="#2F6FFF" filter="url(#glowCyan)"/>
    <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#2F6FFF" letter-spacing="0.5">GATEWAY</text>
    <!-- Icon: AWS Cloud -->
    <g transform="translate(136, 12)" stroke="#2F6FFF" stroke-width="1.4" fill="none">
      <path d="M5 20 a7 7 0 0 1 0 -14 a9 9 0 0 1 17 -3 a8 8 0 0 1 9 8 a6 6 0 0 1 -2 12 Z" fill="#0C1420" transform="scale(0.85)"/>
    </g>
    <!-- Node Content -->
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">AWS IoT Cloud</text>
    <text x="14" y="88" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" fill="#2F6FFF">Message Broker</text>
    <line x1="14" y1="102" x2="171" y2="102" stroke="#16253B" stroke-width="1"/>
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#8FA3BE">Rules engine &amp; routing</text>
    <text x="14" y="139" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#586E88">Device shadow integration</text>
  </g>

  <!-- Protocol Connector 2 -> 3 -->
  <g transform="translate(465, 87)">
    <rect width="50" height="26" rx="6" fill="#0E1624" stroke="#243854" stroke-width="1.2"/>
    <text x="25" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#2F6FFF">BRIDGE</text>
  </g>

  <!-- ==================== NODE 3: DIGITALOCEAN ==================== -->
  <g transform="translate(520, 25)">
    <rect width="185" height="160" rx="10" fill="url(#cardGrad)" stroke="#1F314D" stroke-width="1.5"/>
    <!-- Status Tag -->
    <rect x="14" y="14" width="76" height="18" rx="9" fill="#132338" stroke="#22395A" stroke-width="1"/>
    <circle cx="23" cy="23" r="3.5" fill="#2BD4E0" filter="url(#glowCyan)"/>
    <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#2BD4E0" letter-spacing="0.5">COMPUTE</text>
    <!-- Icon: Server Stack -->
    <g transform="translate(136, 12)" stroke="#2BD4E0" stroke-width="1.4" fill="none">
      <rect x="2" y="4" width="24" height="6" rx="1.5" fill="#0C1420"/>
      <circle cx="6" cy="7" r="1" fill="#2BD4E0"/>
      <rect x="2" y="12" width="24" height="6" rx="1.5" fill="#0C1420"/>
      <circle cx="6" cy="15" r="1" fill="#2BD4E0"/>
      <rect x="2" y="20" width="24" height="6" rx="1.5" fill="#0C1420"/>
      <circle cx="6" cy="23" r="1" fill="#2BD4E0"/>
    </g>
    <!-- Node Content -->
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">DigitalOcean</text>
    <text x="14" y="88" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" fill="#2BD4E0">Droplet Processing</text>
    <line x1="14" y1="102" x2="171" y2="102" stroke="#16253B" stroke-width="1"/>
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#8FA3BE">Stream ingestion &amp; DB</text>
    <text x="14" y="139" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#586E88">RESTful / WebSocket API</text>
  </g>

  <!-- Protocol Connector 3 -> 4 -->
  <g transform="translate(710, 87)">
    <rect width="45" height="26" rx="6" fill="#0E1624" stroke="#243854" stroke-width="1.2"/>
    <text x="22.5" y="17" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#2BD4E0">SYNC</text>
  </g>

  <!-- ==================== NODE 4: CLIENT APPS ==================== -->
  <g transform="translate(760, 25)">
    <rect width="165" height="160" rx="10" fill="url(#cardGrad)" stroke="#1F314D" stroke-width="1.5"/>
    <!-- Status Tag -->
    <rect x="14" y="14" width="70" height="18" rx="9" fill="#132338" stroke="#22395A" stroke-width="1"/>
    <circle cx="23" cy="23" r="3.5" fill="#2F6FFF" filter="url(#glowCyan)"/>
    <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="700" fill="#2F6FFF" letter-spacing="0.5">CLIENT</text>
    <!-- Icon: Dual Screens -->
    <g transform="translate(120, 12)" stroke="#2F6FFF" stroke-width="1.3" fill="none">
      <rect x="2" y="2" width="22" height="15" rx="1.5" fill="#0C1420"/>
      <path d="M9 17 H17 M13 17 V21 M8 21 H18"/>
      <rect x="17" y="9" width="10" height="16" rx="1.5" fill="#0A0E17" stroke="#2BD4E0"/>
    </g>
    <!-- Node Content -->
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Web &amp; Mobile</text>
    <text x="14" y="88" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" fill="#2F6FFF">Live Dashboards</text>
    <line x1="14" y1="102" x2="151" y2="102" stroke="#16253B" stroke-width="1"/>
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#8FA3BE">Real-time metrics</text>
    <text x="14" y="139" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#586E88">Interactive telemetry</text>
  </g>
</svg>
