<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workstation, cloud, database and IoT data flow illustration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="900" height="360" fill="#0A0E17"/>

  <!-- connecting flow path -->
  <path id="flowPath"
        d="M 140 210 C 260 210 260 120 360 120 C 460 120 460 230 560 230 C 660 230 660 130 760 130"
        fill="none" stroke="#22344A" stroke-width="2" stroke-dasharray="6 8" opacity="0.7"/>

  <!-- traveling data pulses -->
  <circle r="4.5" fill="#2BD4E0" filter="url(#glowSoft)">
    <animateMotion dur="6s" repeatCount="indefinite" begin="0s">
      <mpath href="#flowPath"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#2F6FFF" filter="url(#glowSoft)">
    <animateMotion dur="6s" repeatCount="indefinite" begin="2s">
      <mpath href="#flowPath"/>
    </animateMotion>
  </circle>
  <circle r="3.6" fill="#2BD4E0" filter="url(#glowSoft)">
    <animateMotion dur="6s" repeatCount="indefinite" begin="4s">
      <mpath href="#flowPath"/>
    </animateMotion>
  </circle>

  <!-- Node 1: workstation / laptop -->
  <g transform="translate(80,170)" stroke="#4A5C78" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <path d="M0 0 H120 V56 H0 Z"/>
    <path d="M-10 56 H130 L118 70 H2 Z"/>
    <text x="40" y="34" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace" font-size="20" fill="#2F6FFF" stroke="none">&lt;/&gt;</text>
  </g>
  <text x="140" y="270" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8FA3BE">Workstation</text>

  <!-- Node 2: cloud -->
  <g transform="translate(300,78)" stroke="#4A5C78" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <path d="M18 42 a18 18 0 0 1 0 -36 a22 22 0 0 1 42 -8 a20 20 0 0 1 22 20 a16 16 0 0 1 -4 32 Z" transform="translate(0,-6) scale(1.1)"/>
  </g>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8FA3BE">AWS / Cloud</text>

  <!-- Node 3: database cylinder -->
  <g transform="translate(505,190)" stroke="#4A5C78" stroke-width="2.2" fill="none">
    <ellipse cx="30" cy="10" rx="30" ry="12"/>
    <path d="M0 10 V64 a30 12 0 0 0 60 0 V10"/>
    <path d="M0 32 a30 12 0 0 0 60 0" />
  </g>
  <text x="560" y="290" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8FA3BE">Database</text>

  <!-- Node 4: IoT chip -->
  <g transform="translate(715,90)" stroke="#4A5C78" stroke-width="2.2" fill="none">
    <rect x="10" y="10" width="60" height="60" rx="6"/>
    <circle cx="40" cy="40" r="14"/>
    <path d="M25 10 V0 M40 10 V0 M55 10 V0 M25 80 V70 M40 80 V70 M55 80 V70 M10 25 H0 M10 40 H0 M10 55 H0 M80 25 H70 M80 40 H70 M80 55 H70"/>
  </g>
  <text x="760" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8FA3BE">IoT</text>
</svg>
